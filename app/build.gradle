plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.reno.app'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.reno.app"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                // Room ghi lại cấu trúc CSDL của từng version để viết Migration về sau
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // ./gradlew :app:testDebugUnitTest -PrenoScreenshots=true --tests '*ScreenshotTest'
                // chụp ảnh các màn hình vào app/build/screenshots
                systemProperty 'reno.screenshots', project.findProperty('renoScreenshots') ?: 'false'
                systemProperty 'reno.screenshotDir', "${project.layout.buildDirectory.get().asFile}/screenshots"
            }
        }
    }
}

dependencies {
    // Giao diện
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.androidx.core
    implementation libs.calendar.view

    // Kiến trúc và CSDL
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler
    implementation libs.androidx.work.runtime
    implementation libs.androidx.webkit

    // Thư viện chức năng
    implementation libs.mlkit.text.recognition
    implementation libs.mlkit.translate
    implementation libs.ucrop
    implementation libs.lib.recur

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
